<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Stickerz 2026</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="copa26.png" type="image/png">
</head>

<body>

<nav class="navbar bg-light flex-column p-3 shadow-sm">
  <img src="copa26.png" style="height:60px;" class="mb-2">
  <input id="searchInput" class="form-control w-50 text-center" type="text" placeholder="Buscar seleção...">
  <div id="globalCounter" class="mt-3 text-center fw-bold"></div>
</nav>

<!-- CÓDIGO DO ÁLBUM -->
<div class="text-center mt-2">
  <small class="d-flex justify-content-center align-items-center gap-2">
    <button id="toggleCodeBtn" class="eye-btn" onclick="toggleCode()"></button>
    <strong>Código:</strong>
  </small>
  <div id="albumCode" class="code-box">---</div>
</div>

<div class="container my-4">
  <div class="d-flex gap-2 mb-3">
    <button class="btn btn-dark" onclick="setPage('inicio')">Início</button>
    <button class="btn btn-dark" onclick="setPage('grupos')">Grupos</button>
    <button class="btn btn-dark" onclick="setPage('extras')">Extras</button>
  </div>

  <div id="app"></div>
</div>

<footer class="footer text-center p-3 shadow-sm bg-light">
  <button class="btn btn-dark" onclick="exportData()">Exportar</button>

  <label class="btn btn-dark mb-0">
    Importar
    <input type="file" hidden accept=".json" onchange="importData(event)">
  </label>

  <button class="btn btn-dark" onclick="importByCode()">Código</button>
</footer>

<!-- LZ-STRING -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>

<script src="script.js"></script>
</body>
</html>
